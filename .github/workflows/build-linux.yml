name: Build Linux Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build-linux:
    runs-on: ubuntu-latest # Uses a Linux virtual machine to compile the binary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile with PyInstaller
        run: |
          pyinstaller --onefile --name my-app-linux main.py

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-executable
          path: dist/my-app-linux
