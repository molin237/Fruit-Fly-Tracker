name: Build macOS App

on:
  workflow_dispatch:      # lets you trigger it manually from the GitHub UI
  push:
    branches: [ main ]     # also auto-builds on every push to main

jobs:
  build-macos:
    runs-on: macos-latest   # real Apple hardware, hosted by GitHub, free

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app with PyInstaller
        run: pyinstaller FlyTracker.spec --clean

      - name: Verify executable permissions
        run: |
          BINARY=$(find dist -type f -perm +111 -path "*/Contents/MacOS/*")
          if [ -z "$BINARY" ]; then
            echo "ERROR: no executable with correct permissions found in the .app bundle"
            exit 1
          fi
          echo "Found valid executable:"
          ls -l "$BINARY"

      - name: Zip app with ditto (preserves permissions & metadata)
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent FlyTracker.app FlyTracker-macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlyTracker-macOS
          path: dist/FlyTracker-macOS.zip
